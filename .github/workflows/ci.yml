name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 26
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Build packages and typecheck
        run: pnpm typecheck

      - name: Run core and build tests
        run: node --import tsx --test test/build.test.ts test/config.test.ts test/landing.test.ts test/output.test.ts

      - name: Run share tests
        if: ${{ !cancelled() }}
        run: node --import tsx --test test/share.test.ts

      - name: Run CLI smoke tests
        if: ${{ !cancelled() }}
        run: node --import tsx --test test/smoke.test.ts

      - name: Verify published package contents
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == 24 }}
        run: pnpm test:package

  web:
    name: Website build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm build:web
